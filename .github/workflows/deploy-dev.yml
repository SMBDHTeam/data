name: Deploy AI Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-data-ai
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write


jobs:
  deploy:

    name: Build and Deploy AI Server
    runs-on: ubuntu-latest

    steps:

      # GitHub Repository Checkout
      - name: Checkout repository
        uses: actions/checkout@v6


      # Docker Build 환경 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # AWS OIDC 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # Docker Image Build & Push
      - name: Build and push AI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest-dev
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # EC2 Deploy
      - name: Deploy to Dev EC2

        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}

          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}

          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
          SKT_API_KEY: ${{ secrets.SKT_API_KEY }}


        run: |

          set -euo pipefail

          echo "Validate required variables"

          required_variables=(
            DEV_HOST
            DEV_SSH_USER
            DEV_SSH_KEY
            AWS_REGION
            ECR_REGISTRY
            ECR_REPOSITORY_NAME
            SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD
            ODSAY_API_KEY
          )

          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "ERROR: ${variable_name} is empty"
              exit 1
            fi
          done

          echo "Prepare SSH"

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh


          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/dev_key

          chmod 600 ~/.ssh/dev_key


          ssh-keyscan \
            -H "$DEV_HOST" \
            >> ~/.ssh/known_hosts

          # server 레포의 배포 워크플로도 같은 디렉터리에 환경변수 파일을 만든다.
          # 예전에는 두 레포가 모두 .env.dev를 써서 나중에 배포한 쪽이 상대의 값을
          # 덮어썼고, 그 뒤 상대 컨테이너가 재시작하면 설정을 잃었다.
          # 파일을 분리해 서로 간섭하지 않게 한다. (server는 .env.server를 쓴다)
          echo "Create .env.data"

          {
            printf 'SPRING_DATASOURCE_URL=%s\n' "$SPRING_DATASOURCE_URL"
            printf 'SPRING_DATASOURCE_USERNAME=%s\n' "$SPRING_DATASOURCE_USERNAME"
            printf 'SPRING_DATASOURCE_PASSWORD=%s\n' "$SPRING_DATASOURCE_PASSWORD"
            printf 'ODSAY_ENABLED=true\n'
            printf 'ODSAY_API_KEY=%s\n' "$ODSAY_API_KEY"
            if [ -n "${SKT_API_KEY:-}" ]; then
              printf 'TMAP_WALKING_ENABLED=true\n'
              printf 'SKT_API_KEY=%s\n' "$SKT_API_KEY"
            fi
          } > .env.data

          chmod 600 .env.data

          echo "Upload .env.data"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/dev_key \
            "$DEV_SSH_USER@$DEV_HOST" \
            "sudo mkdir -p /opt/hackathon-dev && sudo chown -R $DEV_SSH_USER:$DEV_SSH_USER /opt/hackathon-dev"

          scp \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/dev_key \
            .env.data \
            "$DEV_SSH_USER@$DEV_HOST:/opt/hackathon-dev/.env.data"



          echo "Deploy AI container"


          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/dev_key \
            "$DEV_SSH_USER@$DEV_HOST" \
            "
            set -e

            echo '[1/6] Login ECR'

            aws ecr get-login-password \
              --region ${AWS_REGION} \
              | docker login \
                  --username AWS \
                  --password-stdin ${ECR_REGISTRY}



            echo '[2/6] Pull image'

            docker pull \
              ${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:latest-dev



            echo '[3/6] Remove old container'

            docker stop data-ai || true

            docker rm data-ai || true



            echo '[4/6] Run AI container'

            docker run -d \
              --name data-ai \
              --restart unless-stopped \
              --network hackathon-network \
              -p 127.0.0.1:8010:8010 \
              --env-file /opt/hackathon-dev/.env.data \
              ${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:latest-dev



            echo '[5/6] Health check'

            sleep 5

            curl \
              -fsS \
              http://127.0.0.1:8010/health



            echo '[6/6] Cleanup'

            docker image prune -f


            echo 'AI deployment completed'
            "


          rm -f .env.data ~/.ssh/dev_key
